<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNOVATE-Share Your Memory</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <img src="pics/LOGO INNOVATE.png" class="screenLogo">
    <div id="app" class="app">
        <!-- Screen A: Start -->
        <section id="screenStart" class="screen screen--active screen--start" aria-label="Start screen">
            <div class="screenStart__overlay">
                <div
                    id="startPanelWrap"
                    class="screenStart__panelWrap"
                    data-btn-x="208.2"
                    data-btn-y="1042.1"
                    data-btn-w="474.4"
                    data-btn-h="208"
                >
                    <img id="startPanelImg" class="screenStart__panel" src="pics/startCamera.png" alt="Start panel">
                    <button id="startFlow" class="startButton" type="button">START</button>
                </div>
            </div>
        </section>

       <!-- Screen B: Capture -->
        <section id="screenCapture" class="screen" aria-label="Capture screen">
            <div class="captureWrap">
                <div class="captureLeft">
                    <video id="video" autoplay playsinline muted class="srOnly"></video>
                    <div id="capturePreview" class="capturePanel__preview" aria-label="Camera preview">
                        <canvas id="previewCanvas"></canvas>
                        <div id="countdown" class="countdown-overlay">
                            <div class="countdown-number">3</div>
                        </div>
                        <div id="captureCount" class="captureCount">0 / 4</div>
                        <button id="capturePhoto" class="captureButton" type="button" disabled>CAPTURE</button>
                    </div>
                </div>
                <canvas id="canvas" style="display: none;"></canvas>
            </div>
        </section>
        <!-- Screen E: Select photos -->
        <section id="screenSelect" class="screen" aria-label="Select photos screen">
            <div class="screenCard screenCard--wide">
                <h2 class="screenTitle">Select your pictures</h2>
                <p id="selectHint" class="screenSubtitle"></p>

                <div class="selectGrid" id="selectGrid" aria-label="Select photos"></div>

                <div class="actionRow">
                    <button id="backToCapture" class="btn btn-secondary" type="button">Retake</button>
                    <button id="confirmSelection" class="btn btn-primary" type="button" disabled>Confirm</button>
                </div>
            </div>
        </section>

        <!-- Screen F: Final -->
        <section id="screenFinal" class="screen" aria-label="Final strip screen">
            <div class="screenCard screenCard--wide">

                <div class="finalPreview">
                    <img id="finalStripPreview" alt="Final photostrip preview">
                </div>

                <div class="actionRow actionRow--wrap">
                    <button id="downloadFinal" class="btn btn-success" type="button">Download</button>
                    <button id="shareFinal" class="btn btn-primary" type="button">Share</button>
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="js/mediaMMA.js"></script>
</body>
</html>
